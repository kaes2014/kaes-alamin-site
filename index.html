<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAES</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }
    .card {
      width: min(90%, 720px);
      padding: 56px 32px;
      text-align: center;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(0,0,0,.08);
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(42px, 8vw, 84px);
      letter-spacing: 4px;
    }
    p {
      margin: 0 0 28px;
      font-size: 18px;
      color: #555;
    }
    .btn {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 999px;
      text-decoration: none;
      background: #111;
      color: #fff;
      font-weight: 700;
    }
    .deploy-status {
      display: block;
      margin-top: 24px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>KAES</h1>
    <p>Webbplatsen är nu ansluten och redo att byggas vidare.</p>
    <a class="btn" href="#">Kommer snart</a>
    <small class="deploy-status">Publicerad via GitHub till Hostinger</small>
  </main>
</body>
</html>
